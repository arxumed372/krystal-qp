<!doctype html>
<meta charset="utf-8">
<title>Двойник окна Add Liquidity для проверки Krystal QP</title>
<!--
  Двойник собран по снимкам экрана владельца от 02.09.2026. Воспроизводит то,
  что на них видно и что важно для сценария:

    - подписи «Min Price» и «Max Price» у полей границ;
    - строка «Current Price 0.009975 USDG per JINQIAN»;
    - вкладки «Zap In» и «Manual»;
    - в «Deposit Amounts» ДВА поля, и поле второго токена ИСЧЕЗАЕТ, когда
      верхняя граница уходит ниже текущей цены. Ради этого исчезновения всё
      и делается: тогда позиция входит одним USDG.
-->
<body style="font:14px system-ui;background:#0b1220;color:#e2e8f0;padding:18px">
<!-- Идентификатор в стиле React 18 / Chakra: именно на таком расширение
     упало у владельца — "#chakra-modal--body-:ro0:" недопустим в CSS. -->
<!-- Кнопка, которой окно открывают: лежит ЗА окном. Владелец на неё
     напоролся — расширение видело две кнопки и отказывалось нажимать. -->
<!-- Страница ПОД окном: у неё свои Min/Max и своя кнопка. Именно из-за них
     поиск по всему документу находил поля дважды и отказывался работать. -->
<div id="behind">
  <div>Min Price</div><input id="bgLo" inputmode="decimal" value="1">
  <div>Max Price</div><input id="bgHi" inputmode="decimal" value="2">
  <div>Current Price 999 FAKE per USDG</div>
  <button id="bgAdd">Add Liquidity</button>
</div>
<div id="chakra-modal--body-:ro0:" role="dialog">

<h3>Add liquidity — JINQIAN/USDG</h3>

<div style="display:flex;gap:30px;flex-wrap:wrap">
  <div style="min-width:330px">
    <div>Price Range
      <button id="unitA">USDG</button><button id="unitB">JINQIAN</button>
    </div>
    <div style="margin:10px 0">
      <button id="narrow">Narrow Range</button>
      <button id="wide">Wide Range</button>
      <button id="full">Full Range</button>
    </div>
    <div id="cur">Current Price 100.25 JINQIAN per USDG</div>

    <div style="margin-top:12px">
      <div>Min Price</div>
      <input id="lo" inputmode="decimal">
      <div>JINQIAN per USDG</div>
    </div>
    <div style="margin-top:12px">
      <div>Max Price</div>
      <input id="hi" inputmode="decimal">
      <div>JINQIAN per USDG</div>
    </div>
  </div>

  <div style="min-width:330px">
    <div>
      <button id="zap">⚡ Zap In</button>
      <button id="manual" aria-selected="true">👆 Manual</button>
    </div>
    <div style="margin-top:10px">Deposit Amounts</div>
    <div id="usdgBox" style="margin-top:8px">
      <input id="amtUsdg" inputmode="decimal"> USDG
    </div>
    <div id="jinBox" style="margin-top:8px">
      <input id="amtJin" inputmode="decimal"> JINQIAN
    </div>
    <button id="add" style="margin-top:12px">Add Liquidity</button>
  </div>
</div>

</div>
<script>
// Управляемые поля: значение живёт в состоянии, как в React.
const PRICE = 0.009975;
const state = { lo: '0.007836563167142053', hi: '0.014364646284887317',
                amtUsdg: '', amtJin: '' };
const els = { lo: lo, hi: hi, amtUsdg: amtUsdg, amtJin: amtJin };

// Поле второго токена нужно, только пока верхняя граница ВЫШЕ цены.
function relayout() {
  const hiV = parseFloat(state.hi);
  const twoSided = !(hiV > 0) || hiV > PRICE;
  jinBox.style.display = (twoSided || window.KEEP) ? '' : 'none';
  if (!twoSided) { state.amtJin = ''; els.amtJin.value = ''; }
}

for (const [k, el] of Object.entries(els)) {
  el.value = state[k];
  el.addEventListener('input', () => { state[k] = el.value; relayout(); });
}
relayout();

wide.onclick = () => {
  state.lo = '0.007836563167142053'; state.hi = '0.014364646284887317';
  els.lo.value = state.lo; els.hi.value = state.hi; relayout();
};
manual.onclick = () => { manual.setAttribute('aria-selected','true');
                         zap.setAttribute('aria-selected','false'); };
zap.onclick = () => { zap.setAttribute('aria-selected','true');
                      manual.setAttribute('aria-selected','false'); };

// Выбранное имя становится знаменателем — как на настоящем сайте.
unitA.onclick = () => { cur.textContent = 'Current Price 100.25 JINQIAN per USDG'; };
unitB.onclick = () => { cur.textContent = 'Current Price 0.009975 USDG per JINQIAN'; };
window.clicked = null;
document.getElementById('add').addEventListener('click', () => {
  window.clicked = document.getElementById('add').textContent;
});
// Режим «второе поле остаётся видимым» — так вело себя окно у владельца:
// поле STRATTON исчезло с экрана, но расширение всё равно считало поля.
// Сайт подставляет свою сумму с задержкой — ровно это поведение и подвело.
window.OVERWRITE = 0;   // сколько раз ещё перепишет
els.amtUsdg.addEventListener('input', () => {
  if (window.OVERWRITE > 0 && state.amtUsdg !== '430.74') {
    window.OVERWRITE--;
    setTimeout(() => { state.amtUsdg='430.74'; els.amtUsdg.value='430.74'; }, 400);
  }
});
// Перерисовка поля суммы: сайт заменяет узел новым при смене границ.
// Старая ссылка остаётся жить вне документа — писать в неё бесполезно.
window.REMOUNT = false;
function remountAmount() {
  const old = els.amtUsdg;
  const fresh = old.cloneNode(true);
  fresh.value = state.amtUsdg;
  old.replaceWith(fresh);
  els.amtUsdg = fresh;
  fresh.addEventListener('input', () => { state.amtUsdg = fresh.value; relayout(); });
}
for (const k of ['lo','hi']) {
  els[k].addEventListener('input', () => {
    if (window.REMOUNT) setTimeout(remountAmount, 120);
  });
}
window.keepSecond = (on) => { window.KEEP = !!on; relayout(); };
window.readState = () => ({ ...state, второеПолеВидно: jinBox.style.display !== 'none' });
window.resetAll = () => {
  state.lo='0.007836563167142053'; state.hi='0.014364646284887317';
  state.amtUsdg=''; state.amtJin='';
  for (const [k,el] of Object.entries(els)) el.value = state[k];
  relayout();
};
</script>

<script src="/src/settings.js"></script>
<script src="/src/dom.js"></script>
<script src="/src/teach.js"></script>
<script src="/src/actions.js"></script>
<script src="/src/panel.js"></script>
